<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate PDF Brand Machine</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF-LIB & HTML2CANVAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Montserrat', sans-serif;
        }

        /* HIDDEN HEADER - Optimized Width */
        #hidden-header-container {
            position: absolute;
            top: -9999px;
            left: 0;
            width: 1050px; 
            background-color: transparent;
            padding: 20px 40px; 
        }

        .compact-header {
            border-bottom: 3.5px solid #1f2937;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background-color: white; 
            width: 100%;
        }
        
        .text-3d { 
            text-shadow: 2px 2px 0px #cbd5e1, 4px 4px 0px #94a3b8; 
            color: #003399;
            white-space: nowrap; 
        }
        
        /* Upload Areas */
        .upload-box {
            position: relative;
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #eff6ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            background: #dbeafe;
            border-color: #2563eb;
        }
        .upload-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .loader {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom UI Inputs */
        input[type="radio"], input[type="checkbox"] { accent-color: #2563eb; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <!-- ================= HIDDEN HEADER TEMPLATE ================= -->
    <div id="hidden-header-container">
        <div class="compact-header" id="header-to-render">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; border-left: 6px solid #166534; padding-left: 15px;">
                <span style="font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 800; color: #800000; text-transform: uppercase;">
                    <i class="fa-solid fa-phone-volume" style="color: #166534;"></i> 9874818757
                </span>
                <span style="font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 800; color: #4B0082; text-transform: uppercase;">
                    <i class="fa-solid fa-pen-nib" style="color: #166534;"></i> By Nabiul Sir
                </span>
            </div>
            
            <div style="flex: 1.2; text-align: center; padding-bottom: 2px;">
                <span class="text-3d" style="font-family: 'Cinzel', serif; font-size: 38px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;">RADIANT LEARNERS HUB</span>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                <span style="font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; color: #006633; text-transform: uppercase; border-bottom: 2px solid #9ca3af; padding-bottom: 3px; letter-spacing: 0.5px;">
                    INTEGRATED STUDY MATERIALS
                </span>
                <span id="dynamic-date" style="font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; color: #993300;"></span>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP UI ================= -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100">
        
        <div class="bg-blue-600 text-white p-5 text-center">
            <h1 class="text-2xl font-black tracking-wide"><i class="fa-solid fa-file-pdf mr-2"></i> PDF Brand Machine</h1>
            <p class="text-blue-100 text-sm mt-1">১০০% অফলাইন, সুপারফাস্ট এবং গ্যারান্টিড ডিজাইন</p>
        </div>

        <div class="p-6 space-y-5">
            
            <!-- Stamp Upload Section (Permanent Fix) -->
            <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="stamp-preview-container" class="w-12 h-12 bg-white rounded-lg border border-blue-200 flex items-center justify-center overflow-hidden">
                        <i id="stamp-icon" class="fa-solid fa-image text-blue-300 text-xl"></i>
                        <img id="stamp-preview-img" class="w-full h-full object-contain hidden" src="" alt="Stamp">
                    </div>
                    <div>
                        <p class="text-sm font-bold text-blue-800">আপনার স্ট্যাম্প (Watermark)</p>
                        <p class="text-xs text-blue-600" id="stamp-status-text">স্ট্যাম্প সেভ করা নেই</p>
                    </div>
                </div>
                <div class="relative">
                    <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition-colors">
                        <i class="fa-solid fa-upload"></i> ছবি দিন
                    </button>
                    <input type="file" id="stamp-upload" accept="image/*" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">
                </div>
            </div>

            <!-- PDF Upload -->
            <div class="upload-box py-8" id="drop-zone">
                <input type="file" id="pdf-upload" accept="application/pdf">
                <div class="pointer-events-none">
                    <i class="fa-solid fa-file-pdf text-4xl text-red-500 mb-2"></i>
                    <h3 class="text-base font-bold text-gray-700" id="file-name-display">পিডিএফ ফাইল নির্বাচন করুন</h3>
                </div>
            </div>

            <!-- Configuration Options -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-200">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="add-stamp" class="w-5 h-5">
                        <span class="font-bold text-gray-800">সব পেজে স্ট্যাম্প যুক্ত করুন</span>
                    </label>
                </div>

                <div>
                    <label class="flex items-center space-x-3 cursor-pointer mb-2">
                        <input type="checkbox" id="add-header" class="w-5 h-5">
                        <span class="font-bold text-gray-800">হেডার যুক্ত করুন</span>
                    </label>
                    
                    <div class="pl-8 flex gap-5 mt-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="headerMode" value="first" class="w-4 h-4">
                            <span class="text-sm font-semibold text-gray-600">১ম পেজে</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="headerMode" value="all" class="w-4 h-4">
                            <span class="text-sm font-semibold text-gray-600">প্রতিটি পেজে</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button id="process-btn" onclick="processPDF()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2 opacity-50 cursor-not-allowed" disabled>
                <i class="fa-solid fa-wand-magic-sparkles"></i> প্রসেস এবং ডাউনলোড করুন
            </button>

            <!-- Status -->
            <div id="status-msg" class="text-center text-sm font-bold bg-gray-100 p-2 rounded hidden"></div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // Set dynamic date
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('dynamic-date').innerText = "Date: " + new Date().toLocaleDateString('en-GB', dateOptions);

        // UI Elements
        const fileInput = document.getElementById('pdf-upload');
        const fileNameDisplay = document.getElementById('file-name-display');
        const processBtn = document.getElementById('process-btn');
        const statusMsg = document.getElementById('status-msg');
        
        const addHeaderCheck = document.getElementById('add-header');
        const addStampCheck = document.getElementById('add-stamp');
        const headerRadios = document.getElementsByName('headerMode');

        const stampUpload = document.getElementById('stamp-upload');
        const stampPreviewImg = document.getElementById('stamp-preview-img');
        const stampIcon = document.getElementById('stamp-icon');
        const stampStatusText = document.getElementById('stamp-status-text');

        let selectedFile = null;

        // ================= SETTINGS & STAMP SAVER (LOCALSTORAGE) =================
        function saveSettings() {
            const headerMode = document.querySelector('input[name="headerMode"]:checked').value;
            const settings = {
                addHeader: addHeaderCheck.checked,
                addStamp: addStampCheck.checked,
                headerMode: headerMode
            };
            localStorage.setItem('pdfMachineSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            // Load Checkboxes
            const saved = localStorage.getItem('pdfMachineSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                addHeaderCheck.checked = settings.addHeader;
                addStampCheck.checked = settings.addStamp;
                Array.from(headerRadios).forEach(r => {
                    if (r.value === settings.headerMode) r.checked = true;
                });
            } else {
                addHeaderCheck.checked = true;
                addStampCheck.checked = true;
                headerRadios[0].checked = true;
            }

            // Load Saved Stamp
            const savedStamp = localStorage.getItem('savedStampImage');
            if(savedStamp) {
                stampPreviewImg.src = savedStamp;
                stampPreviewImg.classList.remove('hidden');
                stampIcon.classList.add('hidden');
                stampStatusText.innerText = "স্ট্যাম্প সেভ করা আছে";
                stampStatusText.classList.remove('text-blue-600');
                stampStatusText.classList.add('text-green-600');
            }
        }

        addHeaderCheck.addEventListener('change', saveSettings);
        addStampCheck.addEventListener('change', saveSettings);
        Array.from(headerRadios).forEach(r => r.addEventListener('change', saveSettings));
        window.addEventListener('DOMContentLoaded', loadSettings);

        // ================= STAMP UPLOAD LOGIC =================
        stampUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Img = event.target.result;
                    // Save to local storage permanently
                    localStorage.setItem('savedStampImage', base64Img);
                    
                    // Update UI
                    stampPreviewImg.src = base64Img;
                    stampPreviewImg.classList.remove('hidden');
                    stampIcon.classList.add('hidden');
                    stampStatusText.innerText = "নতুন স্ট্যাম্প যুক্ত হয়েছে!";
                    stampStatusText.classList.remove('text-blue-600');
                    stampStatusText.classList.add('text-green-600');
                    
                    showStatus("স্ট্যাম্প সফলভাবে সেভ হয়েছে!", "success");
                };
                reader.readAsDataURL(file);
            }
        });

        // ================= PDF FILE UPLOAD LOGIC =================
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                if(selectedFile.type !== "application/pdf") {
                    showStatus("শুধুমাত্র PDF ফাইল সাপোর্ট করে!", "error");
                    selectedFile = null;
                    processBtn.disabled = true;
                    processBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    return;
                }
                fileNameDisplay.innerHTML = `<span class="text-blue-700 font-bold">${selectedFile.name}</span>`;
                processBtn.disabled = false;
                processBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusMsg.classList.add('hidden');
            }
        });

        function showStatus(msg, type) {
            return new Promise(resolve => {
                statusMsg.classList.remove('hidden', 'text-green-600', 'text-red-600', 'text-blue-600');
                statusMsg.innerHTML = msg;
                if (type === 'success') statusMsg.classList.add('text-green-600');
                else if (type === 'error') statusMsg.classList.add('text-red-600');
                else statusMsg.classList.add('text-blue-600');
                setTimeout(resolve, 50);
            });
        }

        // ================= MAIN PDF PROCESSING =================
        async function processPDF() {
            if (!selectedFile) return;

            const isStampChecked = addStampCheck.checked;
            const savedStamp = localStorage.getItem('savedStampImage');
            
            if (isStampChecked && !savedStamp) {
                showStatus("দয়া করে উপরের অপশন থেকে আপনার স্ট্যাম্পের ছবিটি আপলোড করুন!", "error");
                return;
            }

            processBtn.disabled = true;
            processBtn.innerHTML = '<div class="loader"></div> <span class="ml-2">প্রসেসিং হচ্ছে...</span>';
            
            try {
                await showStatus("<div class='loader'></div> অরিজিনাল পিডিএফ পড়া হচ্ছে...", "info");
                
                const arrayBuffer = await selectedFile.arrayBuffer();
                const { PDFDocument } = PDFLib;
                
                const sourcePdf = await PDFDocument.load(arrayBuffer);
                const newPdfDoc = await PDFDocument.create();
                const totalPages = sourcePdf.getPageCount();

                // 1. Prepare Header
                let headerImageEmbed = null;
                const isHeaderEnabled = addHeaderCheck.checked;
                const headerMode = document.querySelector('input[name="headerMode"]:checked').value;
                
                if (isHeaderEnabled) {
                    await showStatus("<div class='loader'></div> হেডার তৈরি করা হচ্ছে...", "info");
                    await document.fonts.ready;
                    const headerNode = document.getElementById('hidden-header-container');
                    const canvas = await html2canvas(headerNode, { scale: 2, backgroundColor: null, logging: false });
                    headerImageEmbed = await newPdfDoc.embedPng(canvas.toDataURL('image/png'));
                }

                // 2. Prepare Stamp (From Local Storage - 100% Guaranteed to work)
                let stampImageEmbed = null;
                if (isStampChecked && savedStamp) {
                    await showStatus("<div class='loader'></div> স্ট্যাম্প লোড করা হচ্ছে...", "info");
                    
                    // Check if the uploaded image is PNG or JPEG
                    if(savedStamp.includes('image/png')) {
                        stampImageEmbed = await newPdfDoc.embedPng(savedStamp);
                    } else if(savedStamp.includes('image/jpeg') || savedStamp.includes('image/jpg')) {
                        stampImageEmbed = await newPdfDoc.embedJpg(savedStamp);
                    } else {
                        // If WebP or other, draw to canvas and convert to PNG first
                        const img = new Image();
                        img.src = savedStamp;
                        await new Promise(res => img.onload = res);
                        const cvs = document.createElement('canvas');
                        cvs.width = img.width; cvs.height = img.height;
                        cvs.getContext('2d').drawImage(img, 0, 0);
                        stampImageEmbed = await newPdfDoc.embedPng(cvs.toDataURL('image/png'));
                    }
                }

                // 3. Process Pages
                for (let i = 0; i < totalPages; i++) {
                    if (i % 3 === 0 || i === 0) {
                        await showStatus(`<div class='loader'></div> পেজ ${i + 1} / ${totalPages} প্রসেস হচ্ছে...`, "info");
                    }

                    const srcPage = sourcePdf.getPage(i);
                    const { width, height } = srcPage.getSize();
                    const newPage = newPdfDoc.addPage([width, height]);
                    const embeddedPage = await newPdfDoc.embedPage(srcPage);

                    const needsHeader = isHeaderEnabled && (headerMode === 'all' || i === 0);

                    // ============ HEADER PAGE LOGIC (PERFECT SCALING) ============
                    if (needsHeader && headerImageEmbed) {
                        const headerDims = headerImageEmbed.scale(1);
                        const drawWidth = width;
                        const headerHeightPoints = (headerDims.height * drawWidth) / headerDims.width;
                        
                        // Scale slightly (94%) to ensure footer doesn't get cut off.
                        const scaleFactor = 0.94;
                        const scaledWidth = width * scaleFactor;
                        const scaledHeight = height * scaleFactor;
                        
                        // Center horizontally
                        const xOffset = (width - scaledWidth) / 2;
                        
                        // Lift it up just enough so the footer is visible, but the text starts right under the header!
                        // yOffset = 2% of page height (Very minimal gap at the bottom, so top text sits high)
                        const yOffset = height * 0.02; 
                        
                        // Draw Original Content
                        newPage.drawPage(embeddedPage, {
                            x: xOffset,
                            y: yOffset, 
                            width: scaledWidth,
                            height: scaledHeight
                        });

                        // Draw Header at the very top
                        newPage.drawImage(headerImageEmbed, {
                            x: 0,
                            y: height - headerHeightPoints,
                            width: drawWidth,
                            height: headerHeightPoints,
                        });
                    } 
                    // ============ NORMAL PAGE LOGIC ============
                    else {
                        newPage.drawPage(embeddedPage, { x: 0, y: 0, width: width, height: height });
                    }

                    // ============ STAMP LOGIC (ALL PAGES) ============
                    if (stampImageEmbed) {
                        const stampSize = 130;
                        newPage.drawImage(stampImageEmbed, {
                            x: width - stampSize - 30, // Bottom right corner
                            y: 30,                     // Margin from bottom
                            width: stampSize,
                            height: stampSize,
                            opacity: 0.15              // Transparent watermark
                        });
                    }
                }

                await showStatus("<div class='loader'></div> পিডিএফ সেভ করা হচ্ছে...", "info");
                await new Promise(r => setTimeout(r, 100)); 
                
                // Export PDF
                const modifiedPdfBytes = await newPdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "Radiant_" + selectedFile.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                await showStatus("<i class='fa-solid fa-circle-check'></i> সফলভাবে ডাউনলোড হয়েছে! 🎉", "success");

            } catch (error) {
                console.error("PDF Processing Error:", error);
                await showStatus("<i class='fa-solid fa-circle-exclamation'></i> একটি সমস্যা হয়েছে। ফাইলটি হয়তো প্রোটেক্টেড।", "error");
            } finally {
                processBtn.disabled = false;
                processBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> প্রসেস এবং ডাউনলোড করুন';
            }
        }
    </script>
</body>
</html>
